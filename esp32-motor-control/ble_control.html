<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESP32 Motor Control (BLE)</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14171c;
    --bg-image: none;
    --fg: #f2f3f5;
    --muted: #9aa3af;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(18, 20, 24, 0.62);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    color: var(--fg);
  }
  h1 { font-size: 1.1rem; font-weight: 600; color: var(--muted); margin: 0 0 24px; letter-spacing: .02em; }
  #status {
    font-size: .9rem;
    color: #6ee7a7;
    margin-bottom: 20px;
    min-height: 1.2em;
    text-align: center;
  }
  #status.warn { color: #f5a742; }
  #status.err { color: #f87171; }
  #connectBtn {
    font-size: 1rem;
    font-weight: 600;
    padding: 16px 28px;
    border-radius: 14px;
    border: none;
    color: #fff;
    background: #2563eb;
    margin-bottom: 24px;
  }
  #controls { width: 100%; display: flex; flex-direction: column; align-items: center; }
  #controls[hidden] { display: none; }
  .dpad {
    display: grid;
    grid-template-columns: repeat(2, minmax(120px, 1fr));
    gap: 16px;
    width: 100%;
    margin-bottom: 24px;
  }
  button {
    font-size: 1.1rem;
    font-weight: 600;
    padding: 28px 12px;
    border-radius: 16px;
    border: none;
    color: #fff;
    user-select: none;
    touch-action: manipulation;
  }
  #fwd { background: #2563eb; }
  #rev { background: #7c3aed; }
  #stop {
    grid-column: 1 / -1;
    background: #dc2626;
    padding: 20px 12px;
  }
  button:active { filter: brightness(0.85); transform: scale(0.98); }
  #fwd.active, #rev.active { box-shadow: 0 0 0 3px #ffffffaa inset; }
  .speed-wrap {
    width: 100%;
    text-align: center;
    margin-bottom: 28px;
  }
  .speed-wrap label { display: block; margin-bottom: 8px; color: var(--muted); font-size: .9rem; }
  input[type="range"] { width: 100%; }
  #speedVal { font-variant-numeric: tabular-nums; }
  .presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    margin-bottom: 10px;
  }
  .preset {
    padding: 14px 6px;
    font-size: .95rem;
    border-radius: 12px;
    background: #2a2e37;
    color: var(--fg);
  }
  .presets.editing .preset { outline: 2px dashed var(--muted); outline-offset: 2px; }
  .link-btn {
    background: none;
    border: none;
    padding: 6px 4px;
    font-size: .8rem;
    font-weight: 500;
    color: var(--muted);
    text-decoration: underline;
    margin-bottom: 8px;
  }
  .panel {
    width: 100%;
    text-align: center;
    padding-top: 16px;
    margin-top: 8px;
    border-top: 1px solid #ffffff1a;
  }
  .panel label { display: block; margin-bottom: 10px; color: var(--muted); font-size: .9rem; }
  .swatches { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .swatch {
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid transparent;
  }
  .swatch.active { border-color: var(--fg); }
  #bgPicker {
    width: 44px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: none;
    cursor: pointer;
  }
  .bg-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .file-btn {
    display: inline-block;
    padding: 8px 14px;
    font-size: .85rem;
    font-weight: 500;
    border-radius: 10px;
    background: #2a2e37;
    color: var(--fg);
    cursor: pointer;
  }
  #note {
    max-width: 320px;
    margin-top: 20px;
    font-size: .78rem;
    line-height: 1.4;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>ESP32 MOTOR CONTROL (BLE)</h1>
    <div id="status">not connected</div>

    <button id="connectBtn">Connect via Bluetooth</button>

    <div id="controls" hidden>
      <div class="dpad">
        <button id="fwd">&#9650; FORWARD</button>
        <button id="rev">&#9660; REVERSE</button>
        <button id="stop">&#9632; STOP</button>
      </div>

      <div class="speed-wrap">
        <label>Speed: <span id="speedVal">60</span>%</label>
        <input type="range" id="speed" min="0" max="100" value="60">
      </div>

      <div class="presets" id="presets">
        <button class="preset" data-idx="0">25%</button>
        <button class="preset" data-idx="1">50%</button>
        <button class="preset" data-idx="2">75%</button>
        <button class="preset" data-idx="3">100%</button>
      </div>
      <button class="link-btn" id="editPresetsBtn">&#9998; Edit presets</button>
    </div>

    <div class="panel">
      <label>Background</label>
      <div class="swatches" id="swatches">
        <button class="swatch" data-color="#14171c" style="background:#14171c" aria-label="Slate"></button>
        <button class="swatch" data-color="#0f172a" style="background:#0f172a" aria-label="Navy"></button>
        <button class="swatch" data-color="#1b2e1f" style="background:#1b2e1f" aria-label="Forest"></button>
        <button class="swatch" data-color="#3a1414" style="background:#3a1414" aria-label="Maroon"></button>
        <button class="swatch" data-color="#f4f4f5" style="background:#f4f4f5" aria-label="Light"></button>
      </div>
      <div class="bg-row">
        <input type="color" id="bgPicker" value="#14171c">
        <label class="file-btn" for="bgImageInput">Choose image&hellip;</label>
        <input type="file" id="bgImageInput" accept="image/*" hidden>
        <button class="link-btn" id="clearImageBtn" style="margin-bottom:0">Clear image</button>
      </div>
    </div>

    <div id="note">
      Requires a Chromium-based browser (Chrome, Edge, Opera) on Android,
      desktop, or ChromeOS — Web Bluetooth is not supported in Safari/iOS.
    </div>
  </div>

<script>
  const SERVICE_UUID = 'b3fdd1d0-2c47-4bd6-8f8e-1d6d4d2a6b01';
  const COMMAND_CHAR_UUID = 'b3fdd1d1-2c47-4bd6-8f8e-1d6d4d2a6b01';
  const STATUS_CHAR_UUID = 'b3fdd1d2-2c47-4bd6-8f8e-1d6d4d2a6b01';

  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connectBtn');
  const controlsEl = document.getElementById('controls');
  const speedInput = document.getElementById('speed');
  const speedVal = document.getElementById('speedVal');
  const fwdBtn = document.getElementById('fwd');
  const revBtn = document.getElementById('rev');
  const stopBtn = document.getElementById('stop');

  let device = null;
  let commandChar = null;
  let heartbeat = null;
  let activeDir = null; // 'fwd' | 'rev' | null

  speedInput.addEventListener('input', () => {
    speedVal.textContent = speedInput.value;
  });

  function pct255() {
    return Math.round(speedInput.value * 255 / 100);
  }

  function setActiveButton(btn) {
    fwdBtn.classList.remove('active');
    revBtn.classList.remove('active');
    if (btn) btn.classList.add('active');
  }

  async function sendCommand(text) {
    if (!commandChar) return;
    try {
      const bytes = new TextEncoder().encode(text);
      await commandChar.writeValueWithoutResponse(bytes);
      statusEl.classList.remove('warn', 'err');
    } catch (e) {
      statusEl.textContent = 'write failed: ' + e.message;
      statusEl.classList.add('err');
    }
  }

  // Tap FORWARD/REVERSE to start moving in that direction -- no need to
  // hold the button down. It keeps running (re-sent every 250ms, which
  // also acts as a heartbeat and lets the speed slider update live)
  // until STOP is tapped, the other direction is selected, or the BLE
  // connection drops.
  function startDirection(dir, btn) {
    activeDir = dir;
    setActiveButton(btn);
    const prefix = dir === 'fwd' ? 'F' : 'R';
    statusEl.textContent = (dir === 'fwd' ? 'forward' : 'reverse') + ' @ ' + speedInput.value + '%';
    sendCommand(prefix + pct255());
    clearInterval(heartbeat);
    heartbeat = setInterval(() => {
      if (activeDir === dir) sendCommand(prefix + pct255());
    }, 250);
  }

  function stopDirection() {
    setActiveButton(null);
    activeDir = null;
    clearInterval(heartbeat);
    statusEl.textContent = 'stopped';
    sendCommand('S');
  }

  fwdBtn.addEventListener('click', () => startDirection('fwd', fwdBtn));
  revBtn.addEventListener('click', () => startDirection('rev', revBtn));
  stopBtn.addEventListener('click', stopDirection);

  function onDisconnected() {
    activeDir = null;
    clearInterval(heartbeat);
    setActiveButton(null);
    commandChar = null;
    controlsEl.hidden = true;
    connectBtn.hidden = false;
    statusEl.textContent = 'disconnected';
    statusEl.classList.add('warn');
  }

  function handleStatusNotification(event) {
    const value = new TextDecoder().decode(event.target.value);
    // Reflects the ESP32's own state, e.g. after its command-timeout
    // watchdog stops the motor on its own.
    if (value === 'STOP' && activeDir !== null) {
      activeDir = null;
      clearInterval(heartbeat);
      setActiveButton(null);
      statusEl.textContent = 'stopped (by device)';
    }
  }

  connectBtn.addEventListener('click', async () => {
    if (!navigator.bluetooth) {
      statusEl.textContent = 'Web Bluetooth not supported in this browser';
      statusEl.classList.add('err');
      return;
    }
    try {
      statusEl.textContent = 'requesting device...';
      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }],
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);

      statusEl.textContent = 'connecting...';
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      commandChar = await service.getCharacteristic(COMMAND_CHAR_UUID);

      try {
        const statusChar = await service.getCharacteristic(STATUS_CHAR_UUID);
        await statusChar.startNotifications();
        statusChar.addEventListener('characteristicvaluechanged', handleStatusNotification);
      } catch (e) {
        // Status characteristic is optional for control; ignore if unavailable.
      }

      connectBtn.hidden = true;
      controlsEl.hidden = false;
      statusEl.textContent = 'connected';
      statusEl.classList.remove('warn', 'err');
    } catch (e) {
      statusEl.textContent = 'connection failed: ' + e.message;
      statusEl.classList.add('err');
    }
  });

  // Safety: if the page is hidden/backgrounded or closed, stop the motor.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && activeDir !== null) stopDirection();
  });
  window.addEventListener('pagehide', () => {
    if (activeDir !== null) stopDirection();
  });

  // ---------------------------------------------------------------
  // Preset speed buttons (saved on this device via localStorage)
  // ---------------------------------------------------------------
  const DEFAULT_PRESETS = [25, 50, 75, 100];
  const presetButtons = Array.from(document.querySelectorAll('.preset'));
  const presetsEl = document.getElementById('presets');
  const editPresetsBtn = document.getElementById('editPresetsBtn');
  let editingPresets = false;

  function clampPct(n) {
    n = Math.round(Number(n));
    if (isNaN(n)) n = 0;
    return Math.max(0, Math.min(100, n));
  }

  function loadPresets() {
    try {
      const saved = JSON.parse(localStorage.getItem('motorPresets'));
      if (Array.isArray(saved) && saved.length === 4) return saved.map(clampPct);
    } catch (e) { /* ignore -- fall back to defaults */ }
    return DEFAULT_PRESETS.slice();
  }

  let presets = loadPresets();

  function savePresets() {
    try { localStorage.setItem('motorPresets', JSON.stringify(presets)); } catch (e) { /* storage unavailable */ }
  }

  function renderPresets() {
    presetButtons.forEach((btn, i) => { btn.textContent = presets[i] + '%'; });
  }

  function applyPreset(i) {
    speedInput.value = presets[i];
    speedVal.textContent = presets[i];
    // If the motor is already running, push the new speed immediately
    // instead of waiting for the next heartbeat tick.
    if (activeDir) {
      const prefix = activeDir === 'fwd' ? 'F' : 'R';
      statusEl.textContent = (activeDir === 'fwd' ? 'forward' : 'reverse') + ' @ ' + presets[i] + '%';
      sendCommand(prefix + pct255());
    }
  }

  presetButtons.forEach((btn, i) => {
    btn.addEventListener('click', () => {
      if (editingPresets) {
        const val = prompt('Preset ' + (i + 1) + ' speed (0-100%):', presets[i]);
        if (val !== null) {
          presets[i] = clampPct(val);
          savePresets();
          renderPresets();
        }
      } else {
        applyPreset(i);
      }
    });
  });

  editPresetsBtn.addEventListener('click', () => {
    editingPresets = !editingPresets;
    editPresetsBtn.textContent = editingPresets ? 'Done' : '✎ Edit presets';
    presetsEl.classList.toggle('editing', editingPresets);
  });

  renderPresets();

  // ---------------------------------------------------------------
  // Background: solid color or a photo, saved on this device via
  // localStorage. A photo is downscaled/recompressed client-side
  // before storing so it fits comfortably in localStorage. Choosing
  // a color clears any stored photo (they're mutually exclusive --
  // the photo would otherwise just paint over the solid color).
  // ---------------------------------------------------------------
  const bgPicker = document.getElementById('bgPicker');
  const bgImageInput = document.getElementById('bgImageInput');
  const clearImageBtn = document.getElementById('clearImageBtn');
  const swatchButtons = Array.from(document.querySelectorAll('.swatch'));

  function setBgColorVar(hex) {
    document.documentElement.style.setProperty('--bg', hex);
    bgPicker.value = hex;
    swatchButtons.forEach((s) => s.classList.toggle('active', s.dataset.color.toLowerCase() === hex.toLowerCase()));
  }

  function setBgImageVar(dataUrl) {
    document.documentElement.style.setProperty('--bg-image', dataUrl ? 'url("' + dataUrl + '")' : 'none');
  }

  function chooseColor(hex) {
    setBgColorVar(hex);
    setBgImageVar(null);
    try {
      localStorage.setItem('motorBgColor', hex);
      localStorage.removeItem('motorBgImage');
    } catch (e) { /* storage unavailable */ }
  }

  function chooseImage(dataUrl) {
    setBgImageVar(dataUrl);
    try { localStorage.setItem('motorBgImage', dataUrl); } catch (e) {
      alert('Could not save that image (it may be too large for this browser). The background was applied for this session only.');
    }
  }

  function clearImage() {
    setBgImageVar(null);
    try { localStorage.removeItem('motorBgImage'); } catch (e) { /* storage unavailable */ }
  }

  // Downscale and re-compress the chosen photo so it stays well within
  // localStorage's size limits and loads quickly.
  function loadImageFile(file) {
    const MAX_DIM = 1600;
    return new Promise((resolve, reject) => {
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        let { width, height } = img;
        if (width > MAX_DIM || height > MAX_DIM) {
          const scale = MAX_DIM / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(objectUrl);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = (e) => { URL.revokeObjectURL(objectUrl); reject(e); };
      img.src = objectUrl;
    });
  }

  swatchButtons.forEach((btn) => btn.addEventListener('click', () => chooseColor(btn.dataset.color)));
  bgPicker.addEventListener('input', () => chooseColor(bgPicker.value));
  clearImageBtn.addEventListener('click', clearImage);

  bgImageInput.addEventListener('change', async () => {
    const file = bgImageInput.files && bgImageInput.files[0];
    bgImageInput.value = ''; // allow re-selecting the same file later
    if (!file) return;
    try {
      chooseImage(await loadImageFile(file));
    } catch (e) {
      alert('Could not load that image.');
    }
  });

  let savedColor = '#14171c';
  try { savedColor = localStorage.getItem('motorBgColor') || savedColor; } catch (e) { /* storage unavailable */ }
  setBgColorVar(savedColor);

  try {
    const savedImage = localStorage.getItem('motorBgImage');
    if (savedImage) setBgImageVar(savedImage);
  } catch (e) { /* storage unavailable */ }
</script>
</body>
</html>
